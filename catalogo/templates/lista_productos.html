<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo — Kuma Coffee</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/estilos.css' %}" />
  <link rel="stylesheet" href="{% static 'css/lista_productos.css' %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body>
   {% include 'includes/navbar.html' %}

  <main class="catalogo-pagina contenedor">
    <div class="catalogo-contenedor panel">
      <h2 class="title">Gestión de Productos</h2>

      <div class="barra-acciones">
        <button class="btn btn-agregar" type="button" onclick="agregarFila()">Agregar otro producto</button>
      </div>

      <div class="tabla-wrap">
        <table class="product-table">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Precio</th>
              <th>Categoría</th>
              <th>Cantidad</th>
              <th>Subtotal</th>
              <th>Acciones</th>
            </tr>
          </thead>

          <tbody id="tabla-body">
            <tr>
              <td><input type="text" placeholder="Geisha premium"></td>
              <td><input type="number" class="precio" placeholder="45000" oninput="calcularFila(this)"></td>
              <td>
                <select>
                  <option>Grano entero</option>
                  <option>Molido</option>
                  <option>Edición especial</option>
                </select>
              </td>
              <td><input type="number" class="cantidad" placeholder="1" oninput="calcularFila(this)"></td>
              <td class="subtotal">$0</td>
              <td>
                <div class="acciones">
                  <button class="btn btn-eliminar" type="button" onclick="eliminarFila(this)">Eliminar</button>
                </div>
              </td>
            </tr>

            <tr>
              <td><input type="text" placeholder="Castillo suave"></td>
              <td><input type="number" class="precio" placeholder="30000" oninput="calcularFila(this)"></td>
              <td>
                <select>
                  <option>Molido</option>
                  <option>Grano entero</option>
                  <option>Edición especial</option>
                </select>
              </td>
              <td><input type="number" class="cantidad" placeholder="2" oninput="calcularFila(this)"></td>
              <td class="subtotal">$0</td>
              <td>
                <div class="acciones">
                  <button class="btn btn-eliminar" type="button" onclick="eliminarFila(this)">Eliminar</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="footer-total">
        <div class="total-box">
          <span>Total de la compra</span>
          <strong id="total-general">$0</strong>
        </div>
      </div>
    </div>
  </main>

  <script>
    function calcularFila(elemento) {
      const fila = elemento.closest("tr");
      const precio = parseFloat(fila.querySelector(".precio").value) || 0;
      const cantidad = parseFloat(fila.querySelector(".cantidad").value) || 0;
      const subtotal = precio * cantidad;

      fila.querySelector(".subtotal").textContent = "$" + subtotal.toLocaleString("es-CO");
      calcularTotal();
    }

    function calcularTotal() {
      let total = 0;
      const filas = document.querySelectorAll("#tabla-body tr");

      filas.forEach(fila => {
        const precio = parseFloat(fila.querySelector(".precio").value) || 0;
        const cantidad = parseFloat(fila.querySelector(".cantidad").value) || 0;
        total += precio * cantidad;
      });

      document.getElementById("total-general").textContent = "$" + total.toLocaleString("es-CO");
    }

    function eliminarFila(boton) {
      const tabla = document.getElementById("tabla-body");
      const fila = boton.closest("tr");

      if (tabla.rows.length > 1) {
        fila.remove();
      } else {
        fila.querySelectorAll("input").forEach(input => input.value = "");
        fila.querySelector(".subtotal").textContent = "$0";
      }

      calcularTotal();
    }

    function agregarFila() {
      const tabla = document.getElementById("tabla-body");
      const nuevaFila = document.createElement("tr");

      nuevaFila.innerHTML = `
        <td><input type="text" placeholder="Nuevo producto"></td>
        <td><input type="number" class="precio" placeholder="0" oninput="calcularFila(this)"></td>
        <td>
          <select>
            <option>Grano entero</option>
            <option>Molido</option>
            <option>Edición especial</option>
          </select>
        </td>
        <td><input type="number" class="cantidad" placeholder="1" oninput="calcularFila(this)"></td>
        <td class="subtotal">$0</td>
        <td>
          <div class="acciones">
            <button class="btn btn-eliminar" type="button" onclick="eliminarFila(this)">Eliminar</button>
          </div>
        </td>
      `;

      tabla.appendChild(nuevaFila);
    }

    window.onload = calcularTotal;
  </script>

{% include 'includes/footer.html' %}
  <script src="https://kit.fontawesome.com/977132abff.js" crossorigin="anonymous"></script>
</body>

</html>
