{% if producto.imagen %}
  <img
    src="/media/{{ producto.imagen }}"
    alt="{{ producto.nombre }}"
    class="{{ img_class }}"
    {% if lazy %}loading="lazy"{% endif %}
  />
{% else %}
  <div class="producto-sin-foto {{ placeholder_class }}" role="img" aria-label="{{ producto.nombre }} sin foto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.75"/>
      <path d="m21 15-5.5-5.5a1.5 1.5 0 0 0-2.12 0L3 20"/>
    </svg>
  </div>
{% endif %}
