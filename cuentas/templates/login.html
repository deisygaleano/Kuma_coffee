{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
</head>
<body>
 <main class="catalogo-pagina auth-pagina">
    <div class="auth-card">  
        {% load static %}
<div class="auth-logo" >
  <img src="{% static 'imagenes/logoproyecto.png' %}" alt="Kuma Coffee" class="auth-logo-img">
</div> 
<h1 class="auth-titulo">Iniciar sesión</h1>


<form method="post" class="auth-form" aria-label="Formulario de inicio de sesión">
  {% csrf_token %}
  <div class="auth-field">
    <label class="auth-label" for="correo">Correo</label>
    <input id="correo" name="correo" type="email" class="auth-input" required />
  </div>
  <div class="auth-field">
    <label class="auth-label" for="password">Contraseña</label>
    <input id="password" name="password" type="password" class="auth-input" required />
  </div>
  <button type="submit" class="btn btn-primary auth-submit">Ingresar</button>
</form>


<ul class="auth-links">
  <li><a href="{% url 'cuentas:restablecer' %}"> ¿Olvidaste tu contraseña?</a></li>
  <li><a href="{% url 'cuentas:registro' %}"> Crear cuenta</a></li>
 
</ul>
    </div>
    <
</body>
</html>
