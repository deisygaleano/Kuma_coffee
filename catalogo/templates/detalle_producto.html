<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geisha regional — Kuma Coffee (demo estática)</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/estilos.css' %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body>
   {% include 'includes/navbar.html' %}


  <main class="catalogo-pagina catalogo-pagina--detalle">
    <div class="catalogo-contenedor">
      <nav class="catalogo-migas" aria-label="Ruta">
        <a href="{% url 'catalogo:lista' %}">Catálogo </a>
        <span aria-hidden="true"> / </span>
        <span>Geisha regional</span>
      </nav>

      <article class="producto-detalle">
        <div class="producto-detalle__media">
          <img src="{% static 'imagenes/bolsa1.png' %}" alt="" class="producto-detalle__img" />
        </div>
        <div class="producto-detalle__info">
          <p class="catalogo-card__cat">Edición especial</p>
          <h1 class="producto-detalle__titulo">Geisha regional — Tueste ligero</h1>
          <p class="producto-detalle__precio">$78000</p>
          <div class="producto-detalle__desc">
            <p>Variedad Geisha en perfil floral y té. </p>
          </div>
          <div class="producto-detalle__acciones">
            <form method="post" class="producto-detalle__add-form">
              
              <input type="hidden" name="next" value="{{ request.get_full_path }}" />
              <input type="hidden" name="producto_id" value="{{ producto.pk }}" />
              <label class="producto-detalle__qty-label" for="qty-detalle">Cantidad</label>
              <input type="number" id="qty-detalle" name="cantidad" class="producto-detalle__qty" value="1" min="1"
                max="99" />
              <button type="submit" class="btn btn-primary">Añadir al carrito</button>
            </form>
            <a class="btn btn-ghost" href="{% url 'catalogo:lista' %}?categoria={{ producto.categoria.slug }}">Más de
              esta categoría</a>
          </div>
        </div>
      </article>

    
    </div>
  </main>

    {% include 'includes/footer.html' %}

  <script src="https://kit.fontawesome.com/977132abff.js" crossorigin="anonymous"></script>
</body>

</html>
